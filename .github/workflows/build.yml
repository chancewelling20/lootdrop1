name: Build Stand Strip jar
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Write mod source files
        run: |
          set -e
          mkdir -p mod && cd mod
          cat > settings.gradle <<'MODEOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'standstrip'
          MODEOF
          cat > gradle.properties <<'MODEOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          loader_version=0.18.1
          fabric_version=0.140.0+1.21.11

          mod_version=1.0.0
          maven_group=com.example
          archives_base_name=standstrip
          MODEOF
          cat > build.gradle <<'MODEOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          MODEOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'MODEOF'
          {
            "schemaVersion": 1,
            "id": "standstrip",
            "version": "${version}",
            "name": "Stand Strip",
            "description": "Client module: auto-takes everything off nearby armor stands, through walls. Toggle with /standstrip.",
            "authors": ["you"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.standstrip.StandStripClient"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          MODEOF
          mkdir -p src/main/java/com/example/standstrip
          cat > src/main/java/com/example/standstrip/StandStripClient.java <<'MODEOF'
          package com.example.standstrip;

          import com.mojang.brigadier.Command;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.multiplayer.MultiPlayerGameMode;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.decoration.ArmorStand;
          import net.minecraft.world.inventory.ClickType;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.EntityHitResult;
          import net.minecraft.world.phys.Vec3;

          import java.util.HashMap;
          import java.util.Map;

          /**
           * Module 1: strips every item off armor stands in range.
           * The server only checks distance for entity interactions (no line-of-sight),
           * so we simply skip the client raycast and interact at a chosen point on the stand.
           */
          public class StandStripClient implements ClientModInitializer {
              // Vanilla entity interaction range is 3.0 (+1 server leeway). Stay under it.
              private static final double RANGE = 3.7;
              private static final int COOLDOWN_TICKS = 2;
              private static final int STAND_BACKOFF_TICKS = 5;

              private static final EquipmentSlot[] SLOTS = {
                      EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS,
                      EquipmentSlot.FEET, EquipmentSlot.MAINHAND, EquipmentSlot.OFFHAND
              };

              private boolean enabled = false;
              private boolean pendingStash = false;
              private int cooldown = 0;
              private final Map<Integer, Long> backoff = new HashMap<>();

              @Override
              public void onInitializeClient() {
                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) ->
                          dispatcher.register(ClientCommandManager.literal("standstrip").executes(ctx -> {
                              enabled = !enabled;
                              backoff.clear();
                              ctx.getSource().sendFeedback(Component.literal(
                                      "Stand Strip: " + (enabled ? "ON" : "OFF")));
                              return Command.SINGLE_SUCCESS;
                          })));

                  ClientTickEvents.END_CLIENT_TICK.register(this::tick);
              }

              private void tick(Minecraft mc) {
                  LocalPlayer player = mc.player;
                  ClientLevel level = mc.level;
                  MultiPlayerGameMode gm = mc.gameMode;
                  if (!enabled || player == null || level == null || gm == null) return;
                  if (mc.screen != null || player.isSpectator()) return;
                  if (cooldown > 0) { cooldown--; return; }

                  // Vanilla swaps the stand's item into an empty hand. Move it into the inventory.
                  if (!player.getMainHandItem().isEmpty()) {
                      if (pendingStash) {
                          int hotbarMenuSlot = 36 + player.getInventory().getSelectedSlot();
                          gm.handleInventoryMouseClick(player.containerMenu.containerId,
                                  hotbarMenuSlot, 0, ClickType.QUICK_MOVE, player);
                          pendingStash = false;
                          cooldown = COOLDOWN_TICKS;
                      }
                      return;
                  }
                  pendingStash = false;

                  Vec3 eye = player.getEyePosition();
                  AABB area = player.getBoundingBox().inflate(RANGE + 1.0);
                  long now = level.getGameTime();

                  for (ArmorStand stand : level.getEntitiesOfClass(ArmorStand.class, area)) {
                      if (stand.getBoundingBox().distanceToSqr(eye) > RANGE * RANGE) continue;
                      Long until = backoff.get(stand.getId());
                      if (until != null && now < until) continue;

                      EquipmentSlot slot = firstOccupied(stand);
                      if (slot == null) continue;

                      // Position relative to the stand decides which slot the server picks.
                      double scale = stand.isSmall() ? 0.5 : 1.0;
                      double y = switch (slot) {
                          case HEAD -> 1.75 * scale;
                          case CHEST -> 1.3 * scale;
                          case LEGS -> 0.7 * scale;
                          case FEET -> 0.25 * scale;
                          default -> 0.0; // hands: server falls through to main/off hand
                      };
                      Vec3 hit = stand.position().add(0, y, 0);
                      gm.interactAt(player, stand, new EntityHitResult(stand, hit), InteractionHand.MAIN_HAND);

                      pendingStash = true;
                      backoff.put(stand.getId(), now + STAND_BACKOFF_TICKS);
                      cooldown = COOLDOWN_TICKS;
                      return; // one interaction per cycle
                  }
              }

              private static EquipmentSlot firstOccupied(ArmorStand stand) {
                  for (EquipmentSlot slot : SLOTS) {
                      if (!stand.getItemBySlot(slot).isEmpty()) return slot;
                  }
                  return null;
              }
          }
          MODEOF

      - name: Build
        run: cd mod && gradle build --no-daemon

      - name: Pick the right jar
        run: |
          mkdir -p out
          cp $(ls mod/build/libs/*.jar | grep -v sources | head -n 1) out/StandStrip.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stand Strip (latest build)
          files: out/StandStrip.jar
